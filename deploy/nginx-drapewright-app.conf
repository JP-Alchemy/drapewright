# The Drapewright web app, included by both versions of its nginx site
# (setup-server.sh installs it as /etc/nginx/snippets/drapewright-app.conf).
# Static files from the live release, with the headers the app needs.
root /var/www/drapewright/current;
index index.html;
charset utf-8;

# nginx compresses only HTML unless told; the WebAssembly engine shrinks to a
# third.
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/wasm
           application/manifest+json image/svg+xml;

# Cross-origin isolation (for WebAssembly threads), and a strict policy: the
# app loads nothing from anywhere else. Keep these the same as
# web/public/_headers, which other hosts read.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Files with a hash in their name never change; everything else (the page,
# the service worker, the manifest) is checked on every visit, so updates
# arrive at once. The map is in the site file.
add_header Cache-Control $drapewright_cache always;

location / {
  try_files $uri $uri/ =404;
}

# Not in nginx's list of types.
location ~ \.webmanifest$ {
  default_type application/manifest+json;
  try_files $uri =404;
}
