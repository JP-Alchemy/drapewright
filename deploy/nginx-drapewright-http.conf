# nginx site for Drapewright before it has an HTTPS certificate. setup-server.sh
# installs this with the domain filled in, gets the certificate through
# /.well-known/acme-challenge/, then replaces it with nginx-drapewright.conf.
# It only answers for its own names, loads after the other sites (so it is
# never nginx's default site), and its variable name is its own.
map $uri $drapewright_cache {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/drapewright/acme;
  }

  include snippets/drapewright-app.conf;
}
