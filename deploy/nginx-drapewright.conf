# nginx site for Drapewright (setup-server.sh installs it with the domain
# filled in once the certificate exists). It only answers for its own names,
# loads after the other sites (so it is never nginx's default site), and its
# variable name is its own.
map $uri $drapewright_cache {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

# Plain HTTP: certificate renewals, and a redirect to the one HTTPS address.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/drapewright/acme;
  }

  location / {
    return 301 https://__DOMAIN__$request_uri;
  }
}

# www goes to the bare domain. Browsers keep saved projects per address, so
# the app has exactly one.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.__DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/drapewright/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/drapewright/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://__DOMAIN__$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/drapewright/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/drapewright/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  include snippets/drapewright-app.conf;
}
