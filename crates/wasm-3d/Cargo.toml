[package]
name = "drapewright-wasm-3d"
description = "WebAssembly facade for Drapewright's 3D side (the avatar, the view of it and the drape), run in the sim worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drapewright-body.workspace = true
drapewright-pattern-core.workspace = true
drapewright-seams.workspace = true
drapewright-sim.workspace = true
# The drape moved on on the graphics card, where it can be.
drapewright-sim-gpu.workspace = true
drapewright-fabric.workspace = true
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
ts-rs.workspace = true
# The graphics card, for the view and the drape.
wgpu.workspace = true

# The 3D view, drawn in the browser only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
drapewright-render.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas"] }
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# The vocabulary of measurements the avatar should take.
drapewright-project.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# `pnpm wasm` runs wasm-opt afterwards (for speed here, not size).
wasm-opt = false
