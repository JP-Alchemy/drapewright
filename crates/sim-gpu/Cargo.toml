[package]
name = "drapewright-sim-gpu"
description = "Drapewright's cloth moved on on the graphics card: the drape's XPBD steps in WebGPU compute shaders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
drapewright-sim.workspace = true
wgpu.workspace = true

[dev-dependencies]
# The avatar and test garments, to drape on the graphics card in tests.
drapewright-body.workspace = true
drapewright-pattern-core.workspace = true
drapewright-project.workspace = true
drapewright-seams.workspace = true
naga.workspace = true
# A graphics card to test on: Metal on a Mac, Vulkan elsewhere (Mesa's
# lavapipe in CI).
wgpu = { workspace = true, features = ["metal", "vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
