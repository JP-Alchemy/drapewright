[package]
name = "drapewright-render"
description = "Drawing Drapewright's 3D view with wgpu (WebGPU, or WebGL2 where there is none): the avatar now, the drape to come"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
wgpu.workspace = true

[dev-dependencies]
naga.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# In the browser: WebGPU where there is one, WebGL2 where there isn't.
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[lints]
workspace = true
