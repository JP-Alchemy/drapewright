[package]
name = "drapewright-sim"
description = "Draping Drapewright's patterns on the avatar: pieces meshed, placed round the body, sewn, and settled as cloth (XPBD)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The avatar the garment is draped on.
drapewright-body.workspace = true
drapewright-pattern-core.workspace = true
drapewright-seams.workspace = true
drapewright-fabric.workspace = true
spade.workspace = true

[dev-dependencies]
# The test skirt written as a project, for the app's tests.
drapewright-project.workspace = true
# Pictures of a drape, to check by eye (the drape_picture example).
tiny-skia.workspace = true
# The made-up garments shared by tests.
drapewright-pattern-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
