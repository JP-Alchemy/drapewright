[package]
name = "drapewright-wasm-core"
description = "WebAssembly facade exposing Drapewright's 2D engine to the browser host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drapewright-pattern-core.workspace = true
drapewright-io.workspace = true
drapewright-project.workspace = true
kurbo.workspace = true
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# `pnpm wasm` runs wasm-opt afterwards, from the binaryen npm package (pinned
# in package.json), so wasm-pack need not download its own.
wasm-opt = false
