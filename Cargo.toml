[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/JP-Alchemy/drapewright"
# The project licence has not been chosen yet (docs/open-questions.md).
publish = false

[workspace.dependencies]
# Our crates
drapewright-pattern-core = { path = "crates/pattern-core" }
drapewright-io = { path = "crates/io" }
drapewright-project = { path = "crates/project" }

# Geometry
kurbo = "0.13.1"
i_overlay = "9.0.1"

# Data
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.152", features = ["float_roundtrip"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
schemars = "1.2.2"
sha2 = "0.11.0"

# Formats
usvg = { version = "0.48.1", default-features = false }
roxmltree = "0.21.1"
pdf-writer = "0.15.0"
flate2 = "1.1.10"
# Deflate only, through flate2 (shared with the PDF writer); no clock, no crypto.
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }

# Pictures of a project for AI assistants (MCP server only)
tiny-skia = "0.12.0"

# WebAssembly facade (the CLI used by wasm-pack must match this version exactly)
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

# Tests
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
lopdf = { version = "0.45.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# Geometry-heavy property tests are slow in debug builds; optimise dependencies
# while keeping our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
